<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="RemindMe is a simple local-first reminder app for Windows and Android browsers." />
  <title>RemindMe</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="bg-orb orb-a"></div>
  <div class="bg-orb orb-b"></div>

  <main class="shell">
    <section class="hero card">
      <div>
        <p class="eyebrow">RemindMe</p>
        <h1>Keep the small things from slipping away.</h1>
        <p class="lede">A clean, local-first reminder app for quick capture, simple follow-up, and less mental clutter.</p>
      </div>
      <div class="stats">
        <div>
          <span id="totalCount">0</span>
          <label>Total</label>
        </div>
        <div>
          <span id="todayCount">0</span>
          <label>Today</label>
        </div>
        <div>
          <span id="doneCount">0</span>
          <label>Done</label>
        </div>
      </div>
    </section>

    <section class="card composer">
      <form id="reminderForm">
        <div class="form-grid">
          <label>
            <span>What do you need to remember?</span>
            <input id="titleInput" name="title" type="text" maxlength="120" placeholder="Call the dentist" required />
          </label>
          <label>
            <span>When?</span>
            <input id="dueInput" name="due" type="datetime-local" />
          </label>
          <label>
            <span>Priority</span>
            <select id="priorityInput" name="priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </label>
          <label>
            <span>Repeat</span>
            <select id="repeatInput" name="repeat">
              <option value="none" selected>Does not repeat</option>
              <option value="daily">Daily</option>
              <option value="weekly">Weekly</option>
              <option value="monthly">Monthly</option>
            </select>
          </label>
        </div>
        <label class="note-field">
          <span>Note</span>
          <textarea id="noteInput" name="note" rows="3" maxlength="300" placeholder="Any details, links, or context"></textarea>
        </label>
        <div class="form-actions">
          <button type="submit">Add reminder</button>
          <button type="button" id="cancelEditButton" class="ghost" hidden>Cancel edit</button>
          <button type="button" id="clearDoneButton" class="ghost">Clear completed</button>
        </div>
      </form>
    </section>

    <section class="card toolbar">
      <div class="filter-group" id="filterGroup" role="tablist" aria-label="Reminder filters">
        <button type="button" data-filter="all" class="active">All</button>
        <button type="button" data-filter="today">Today</button>
        <button type="button" data-filter="upcoming">Upcoming</button>
        <button type="button" data-filter="done">Done</button>
      </div>
      <label class="search">
        <span class="sr-only">Search reminders</span>
        <input id="searchInput" type="search" placeholder="Search reminders" />
      </label>
    </section>

    <section class="card list-card">
      <div class="list-header">
        <h2>Reminders</h2>
        <p id="statusText">Nothing here yet.</p>
      </div>
      <div id="emptyState" class="empty-state">
        <strong>No reminders yet.</strong>
        <span>Add one above and it will show up here.</span>
      </div>
      <ul id="reminderList" class="reminder-list" aria-live="polite"></ul>
    </section>
  </main>

  <template id="reminderTemplate">
    <li class="reminder">
      <article>
        <div class="reminder-main">
          <button class="check" type="button" aria-label="Mark complete">○</button>
          <div class="reminder-copy">
            <h3></h3>
            <p class="meta"></p>
            <p class="note"></p>
          </div>
          <span class="priority"></span>
        </div>
        <div class="reminder-actions">
          <button type="button" class="edit">Edit</button>
          <button type="button" class="snooze">Snooze 1 day</button>
          <button type="button" class="repeat-now">Complete and repeat</button>
          <button type="button" class="delete danger">Delete</button>
        </div>
      </article>
    </li>
  </template>

  <script src="./app.js"></script>
</body>
</html>
